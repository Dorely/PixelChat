appId: com.dorely.pixelchat
productName: PixelChat
directories:
  output: release
files:
  - out/**/*
  - '!out/agent/**/*'
  - '!out/skill/**/*'
  - '!out/native-build/**/*'
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - third-party/**/*
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
extraResources:
  - from: out/agent
    to: agent
  - from: out/skill
    to: skill
  - from: resources/icon.ico
    to: icon.ico
win:
  target: nsis
  icon: resources/icon.ico
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  license: LICENSE
  include: installer/agent.nsh
npmRebuild: true
